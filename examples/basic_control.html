<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BonicBot Unified Control</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            max-width: 900px;
            margin: 0 auto;
            padding: 20px;
            background: #0f172a;
            color: #f8fafc;
            min-height: 100vh;
        }

        .container {
            background: #1e293b;
            border-radius: 24px;
            padding: 30px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            border: 1px solid #334155;
        }

        h1 {
            text-align: center;
            margin-bottom: 30px;
            font-size: 2.5em;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        .control-group {
            background: #334155;
            padding: 20px;
            border-radius: 16px;
            border: 1px solid #475569;
        }

        .control-group h3 {
            margin-top: 0;
            color: #38bdf8;
            border-bottom: 1px solid #475569;
            padding-bottom: 10px;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        button {
            background: #3b82f6;
            color: white;
            border: none;
            padding: 10px 16px;
            margin: 4px;
            border-radius: 10px;
            cursor: pointer;
            font-weight: 600;
            transition: all 0.2s;
        }

        button:hover { background: #2563eb; transform: translateY(-1px); }
        button:disabled { background: #475569; cursor: not-allowed; opacity: 0.5; }

        .connect-btn { background: #10b981; }
        .connect-btn:hover { background: #059669; }
        .disconnect-btn { background: #ef4444; }

        input[type="range"] { width: 100%; accent-color: #38bdf8; }

        .status {
            padding: 12px;
            margin-bottom: 20px;
            border-radius: 12px;
            text-align: center;
            font-weight: bold;
            background: #1e293b;
            border: 2px solid #ef4444;
            color: #ef4444;
        }

        .status.connected {
            border-color: #10b981;
            color: #10b981;
        }

        .log {
            background: #020617;
            color: #94a3b8;
            padding: 15px;
            border-radius: 12px;
            height: 150px;
            overflow-y: auto;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 13px;
            margin-top: 20px;
            border: 1px solid #334155;
        }

        .input-row {
            display: flex;
            flex-direction: column;
            gap: 8px;
            margin-bottom: 15px;
        }

        input[type="text"], input[type="number"] {
            background: #0f172a;
            border: 1px solid #475569;
            color: white;
            padding: 10px;
            border-radius: 8px;
        }

        .matrix-grid {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 4px;
            margin: 10px 0;
        }

        .pixel {
            width: 100%;
            aspect-ratio: 1;
            background: #1e293b;
            border-radius: 2px;
            cursor: pointer;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>🤖 BonicBot Unified Panel</h1>

        <div id="status" class="status">Disconnected</div>

        <div class="grid">
            <!-- Connection -->
            <div class="control-group">
                <h3>🔌 Connection</h3>
                <div class="input-row">
                    <label>BLE Name:</label>
                    <input type="text" id="deviceName" value="BonicBot-S1">
                    <label>App IP (for WebSocket features):</label>
                    <input type="text" id="wsHost" value="" placeholder="e.g. 192.168.1.100">
                </div>
                <button id="connectBtn" class="connect-btn">Connect BLE</button>
                <button id="disconnectBtn" class="disconnect-btn" disabled>Disconnect</button>
            </div>

            <!-- Movement -->
            <div class="control-group">
                <h3>🏃 Movement</h3>
                <div style="text-align: center;">
                    <button onclick="move('f')">Forward</button><br>
                    <button onclick="move('l')">Left</button>
                    <button onclick="move('s')" style="background:#64748b">Stop</button>
                    <button onclick="move('r')">Right</button><br>
                    <button onclick="move('b')">Backward</button>
                </div>
            </div>

            <!-- Head & Matrix -->
            <div class="control-group">
                <h3>🗣️ Head & LED Matrix</h3>
                <label>Pan:</label>
                <input type="range" id="headPan" min="-90" max="90" value="0">
                <label>Tilt:</label>
                <input type="range" id="headTilt" min="-38" max="45" value="0">
                <hr style="border-color:#475569">
                <div class="input-row">
                    <input type="text" id="matrixText" placeholder="Matrix Text">
                    <button onclick="setMatrixText()">Update Matrix</button>
                </div>
            </div>

            <!-- App Bridge -->
            <div class="control-group">
                <h3>📲 App Bridge Features</h3>
                <div class="input-row">
                    <input type="text" id="speechText" placeholder="Speak text...">
                    <button onclick="speak()">Speak</button>
                </div>
                <button onclick="wave()">Wave Hello</button>
                <button onclick="look()">Look Around</button>
                <button onclick="reset()">Home Position</button>
            </div>
        </div>

        <div id="log" class="log">Initializing BonicBot v3.0...</div>
    </div>

    <script type="module">
        import { BonicBotController } from '../src/index.js';

        let bot = null;

        const log = (msg) => {
            const time = new Date().toLocaleTimeString();
            const logEl = document.getElementById('log');
            logEl.innerHTML += `<div><span style="color:#64748b">[${time}]</span> ${msg}</div>`;
            logEl.scrollTop = logEl.scrollHeight;
        };

        const updateUI = (connected) => {
            document.getElementById('status').innerText = connected ? "Connected ✅" : "Disconnected ❌";
            document.getElementById('status').className = connected ? "status connected" : "status";
            document.getElementById('connectBtn').disabled = connected;
            document.getElementById('disconnectBtn').disabled = !connected;
        };

        document.getElementById('connectBtn').onclick = async () => {
            const name = document.getElementById('deviceName').value;
            const host = document.getElementById('wsHost').value;
            
            bot = new BonicBotController(name, host);
            log(`Starting discovery for "${name}"...`);
            
            if (await bot.connect()) {
                log("Successfully connected to BonicBot!");
                updateUI(true);
                
                bot.registerSensorListener('battery', 'ui', (data) => {
                    log(`Battery Update: ${data.soc}% (${data.voltage}V)`);
                });
            } else {
                log("Connection failed. Make sure Bluetooth is enabled.");
            }
        };

        document.getElementById('disconnectBtn').onclick = async () => {
            await bot.close();
            updateUI(false);
            log("Disconnected.");
        };

        // Movement
        window.move = (dir) => {
            if (!bot) return;
            if (dir === 'f') bot.moveForward(100);
            if (dir === 'b') bot.moveBackward(100);
            if (dir === 'l') bot.turnLeft(80);
            if (dir === 'r') bot.turnRight(80);
            if (dir === 's') bot.stopMovement();
        };

        // Head
        const updateHead = () => {
            if (!bot) return;
            bot.controlHead(
                parseInt(document.getElementById('headPan').value),
                parseInt(document.getElementById('headTilt').value)
            );
        };
        document.getElementById('headPan').oninput = updateHead;
        document.getElementById('headTilt').oninput = updateHead;

        // Matrix
        window.setMatrixText = () => {
            const text = document.getElementById('matrixText').value;
            bot.setDisplayText(text);
            log(`Matrix set to: "${text}"`);
        };

        // App Bridge
        window.speak = () => {
            try {
                const text = document.getElementById('speechText').value;
                bot.speak(text);
                log(`Speaking: "${text}"`);
            } catch (e) { log(`Error: ${e.message}`); }
        };

        window.wave = () => bot?.waveHello();
        window.look = () => bot?.lookAround();
        window.reset = () => bot?.resetToHomePosition();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BonicBot Telemetry</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: white; padding: 40px; }
        .container { max-width: 1000px; margin: 0 auto; display: grid; grid-template-columns: 1fr 1fr; gap: 20px; }
        .card { background: #1e293b; padding: 20px; border-radius: 20px; border: 1px solid #334155; }
        .value { font-size: 2em; font-weight: bold; color: #38bdf8; margin: 10px 0; }
        h1 { grid-column: span 2; text-align: center; }
    </style>
</head>
<body>
    <div class="container">
        <h1>📊 Real-Time Telemetry</h1>
        
        <div class="card" style="grid-column: span 2;">
            <h3>📡 Connection</h3>
            <input type="text" id="deviceName" value="BonicBot-S1" style="padding:10px; border-radius:8px;">
            <button onclick="connect()" style="padding:10px 20px; background:#3b82f6; color:white; border:none; border-radius:8px; cursor:pointer;">Connect BLE</button>
        </div>

        <div class="card">
            <h3>🔋 Battery Level</h3>
            <div id="battery-val" class="value">0%</div>
            <canvas id="batteryChart"></canvas>
        </div>

        <div class="card">
            <h3>📏 Distance Sensor</h3>
            <div id="distance-val" class="value">0 mm</div>
            <canvas id="distanceChart"></canvas>
        </div>
    </div>

    <script type="module">
        import { BonicBotController } from '../src/index.js';

        let bot = null;
        const charts = {};

        function setupChart(id, label, color) {
            const ctx = document.getElementById(id).getContext('2d');
            return new Chart(ctx, {
                type: 'line',
                data: { labels: [], datasets: [{ label, data: [], borderColor: color, tension: 0.4 }] },
                options: { 
                    responsive: true, 
                    scales: { y: { beginAtZero: true }, x: { display: false } },
                    animation: false
                }
            });
        }

        window.connect = async () => {
            const name = document.getElementById('deviceName').value;
            bot = new BonicBotController(name);
            
            if (await bot.connect()) {
                charts.battery = setupChart('batteryChart', 'SoC %', '#10b981');
                charts.distance = setupChart('distanceChart', 'Distance (mm)', '#38bdf8');

                // Listen for battery
                bot.registerSensorListener('battery', 'chart', (data) => {
                    document.getElementById('battery-val').innerText = `${data.soc}%`;
                    updateChart(charts.battery, data.soc);
                });

                // Listen for distance
                bot.registerSensorListener('distance', 'chart', (val) => {
                    document.getElementById('distance-val').innerText = `${val.toFixed(0)} mm`;
                    updateChart(charts.distance, val);
                });
            }
        };

        function updateChart(chart, val) {
            chart.data.labels.push("");
            chart.data.datasets[0].data.push(val);
            if (chart.data.labels.length > 20) {
                chart.data.labels.shift();
                chart.data.datasets[0].data.shift();
            }
            chart.update();
        }
    </script>
</body>
</html>

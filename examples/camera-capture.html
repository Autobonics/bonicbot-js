<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BonicBot Camera Capture</title>
    <style>
        body { font-family: system-ui, -apple-system, sans-serif; background: #0f172a; color: white; padding: 40px; }
        .camera-container { background: #1e293b; border-radius: 24px; padding: 20px; text-align: center; max-width: 680px; margin: 0 auto; }
        #stream { width: 100%; border-radius: 12px; background: #000; min-height: 480px; margin-bottom: 20px; }
        .controls { display: flex; gap: 10px; justify-content: center; }
        button { background: #3b82f6; color: white; border: none; padding: 12px 24px; border-radius: 12px; cursor: pointer; font-weight: bold; }
        button:hover { background: #2563eb; }
        #gallery { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 30px; }
        #gallery img { width: 100%; border-radius: 8px; border: 2px solid #334155; }
    </style>
</head>
<body>
    <div class="camera-container">
        <h1>📸 BonicBot Vision</h1>
        <div id="status">Disconnected</div>
        <img id="stream" src="" alt="Camera Stream (Waiting for connection...)">
        
        <div class="controls">
            <input type="text" id="wsHost" placeholder="App IP (e.g. 192.168.1.100)" style="padding:10px; border-radius:8px; border:none;">
            <button onclick="connect()">Connect Stream</button>
            <button onclick="capture()">Take Snapshot</button>
        </div>

        <div id="gallery"></div>
    </div>

    <script type="module">
        import { BonicBotController } from '../src/index.js';

        let bot = null;

        window.connect = async () => {
            const host = document.getElementById('wsHost').value;
            if (!host) return alert("Please enter the Android App IP");
            
            // For camera only, we just need the bridge
            bot = new BonicBotController("BonicBot-S1", host);
            
            document.getElementById('status').innerText = "Connecting...";
            if (await bot.bridge.connect()) {
                document.getElementById('status').innerText = "Connected ✅";
                // Start MJPEG stream (port 8081 is standard for Android MJPEG)
                document.getElementById('stream').src = `http://${host}:8081/video_feed`;
            } else {
                document.getElementById('status').innerText = "Failed ❌";
            }
        };

        window.capture = async () => {
            if (!bot) return;
            const image = await bot.captureImage();
            if (image) {
                const imgEl = document.createElement('img');
                imgEl.src = `data:image/jpeg;base64,${image.imageData}`;
                document.getElementById('gallery').prepend(imgEl);
            }
        };
    </script>
</body>
</html>

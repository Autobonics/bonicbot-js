<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>BonicBot Sequences</title>
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: white; padding: 40px; }
        .container { max-width: 800px; margin: 0 auto; background: #1e293b; padding: 30px; border-radius: 24px; }
        .seq-list { margin-top: 20px; }
        .seq-item { 
            background: #334155; padding: 15px; margin: 10px 0; border-radius: 12px;
            display: flex; justify-content: space-between; align-items: center;
        }
        button { background: #10b981; color: white; border: none; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
        .stop-btn { background: #ef4444; }
        #status-card { background: #0f172a; padding: 15px; border-radius: 12px; margin-top: 20px; border: 1px solid #334155; }
    </style>
</head>
<body>
    <div class="container">
        <h1>🎭 Motion Sequences</h1>
        <div id="connection">
            <input type="text" id="wsHost" placeholder="App IP (e.g. 192.168.1.100)" style="padding:10px; border-radius:8px;">
            <button onclick="connect()">Load Sequences</button>
        </div>

        <div id="status-card" style="display:none">
            <strong>Now Playing:</strong> <span id="current-seq">None</span>
            <div id="progress">Step: 0 / 0</div>
            <button onclick="stop()" class="stop-btn">Stop All</button>
        </div>

        <div id="seq-list" class="seq-list"></div>
    </div>

    <script type="module">
        import { BonicBotController } from '../src/index.js';

        let bot = null;

        window.connect = async () => {
            const host = document.getElementById('wsHost').value;
            bot = new BonicBotController("BonicBot-S1", host);
            
            if (await bot.bridge.connect()) {
                document.getElementById('connection').style.display = 'none';
                document.getElementById('status-card').style.display = 'block';
                loadSequences();
                
                // Monitor status
                bot.registerSensorListener('status', 'ui', (data) => {
                    if (data.sequenceStatus) {
                        const status = data.sequenceStatus;
                        document.getElementById('current-seq').innerText = status.currentSequence || "None";
                        document.getElementById('progress').innerText = `Step: ${status.currentStep} / ${status.totalSteps}`;
                    }
                });
            }
        };

        async function loadSequences() {
            // In a real app, you'd call bot.getSequences()
            // For now, we'll demonstrate playing by name
            const demoSeqs = ["Greeting", "Happy Dance", "Sad Slump", "Victory"];
            const listEl = document.getElementById('seq-list');
            
            demoSeqs.forEach(name => {
                const div = document.createElement('div');
                div.className = 'seq-item';
                div.innerHTML = `<span>${name}</span> <button onclick="play('${name}')">Play</button>`;
                listEl.appendChild(div);
            });
        }

        window.play = (name) => bot?.playSequence(name);
        window.stop = () => bot?.stopSequence();
    </script>
</body>
</html>
